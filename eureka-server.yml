server:
  port: 8761

spring:
  security:
    user:
      name: eureka
      password: eureka

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: eureka-server

logging:
  level:
    com.netflix.discovery: INFO



